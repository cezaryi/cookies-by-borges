<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cookies by Borges · Links</title>
  <meta name="description" content="Cookies by Borges: cardápio, encomendas pelo WhatsApp, retirada, pontos de venda e catálogo de Natal.">
  <meta name="theme-color" content="#fce6e2">
  <meta property="og:title" content="Cookies by Borges">
  <meta property="og:description" content="Cookies artesanais feitos com carinho. Escolha uma opção e peça o seu!">
  <!-- Imagem de compartilhamento: WhatsApp e Facebook exigem URL absoluta.
       Se mudar o endereço do site (ex.: domínio próprio), atualize og:url e og:image.
       Ao trocar a imagem, aumente o ?v= no og:image para o WhatsApp buscar a versão nova. -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:url" content="https://cezaryi.github.io/cookies-by-borges/">
  <meta property="og:image" content="https://cezaryi.github.io/cookies-by-borges/assets/images/og-image.png?v=2">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Logo Cookies by Borges: ilustração da menina com cookies na cabeça">
  <meta name="twitter:card" content="summary_large_image">

  <!--
    EDITE AQUI
    Os links de cada botão estão nos atributos href mais abaixo (procure por "exemplo.com" e "wa.me").
    Cores e fontes ficam nas variáveis do :root, no começo do styles.css.
    Fontes: assets/fonts · Ilustrações: assets/images (os originais não são alterados; cópias ajustadas
    ficam em assets/images/sem-fundo e assets/images/variacoes).
  -->

  <link rel="icon" href="assets/images/logo-menina.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/woff2/bukhari-script.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Biblioteca de desenhos reutilizáveis -->
  <svg class="sprite" aria-hidden="true" focusable="false">
    <defs>
      <!-- Leve tremor nas linhas para parecer feito à mão -->
      <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
        <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </defs>

    <!-- Tracinhos de brilho -->
    <symbol id="i-sparks" viewBox="0 0 30 30">
      <path class="ink ink--thin" d="M5 20 13 22M8 9l6.5 6.5M18 3.5l1 8"/>
    </symbol>

    <!-- Coração -->
    <symbol id="i-heart" viewBox="0 0 24 24">
      <path class="ink ink--thin" d="M12 20C4.5 14.5 2.5 9.5 5.5 6.8 8 4.6 11 6 12 8.6 13 6 16 4.6 18.5 6.8 21.5 9.5 19.5 14.5 12 20Z"/>
    </symbol>

    <!-- Seta -->
    <symbol id="i-chevron" viewBox="0 0 16 24">
      <path class="ink" d="M4 4.5 12 12 4 19.5"/>
    </symbol>
  </svg>

  <div class="page">
  <div class="stage">

    <main class="card">

      <!-- Laço -->
      <svg class="deco bow" viewBox="0 0 180 100" aria-hidden="true" focusable="false">
        <g filter="url(#rough)">
          <path class="bow-fill" d="M84 38C76 54 62 74 48 92L60 90 64 99C76 78 86 58 90 40Z"/>
          <path class="bow-fill" d="M96 38C104 54 118 74 132 92L120 90 116 99C104 78 94 58 90 40Z"/>
          <path class="bow-fill" d="M90 34C70 12 34 2 25 18 17 34 50 48 90 34Z"/>
          <path class="bow-fill" d="M90 34C110 12 146 2 155 18 163 34 130 48 90 34Z"/>
          <path class="bow-fold" d="M84 32C68 22 46 15 34 20M96 32C112 22 134 15 146 20"/>
          <ellipse class="bow-fill" cx="90" cy="36" rx="11" ry="10"/>
          <path class="bow-fold" d="M85 31q5 -3 10 0"/>
        </g>
      </svg>

      <header class="brand">
        <img class="brand__portrait" src="assets/images/logo-menina.svg" width="85" height="113"
             alt="Ilustração da Borges, uma menina de cabelo longo com cookies na cabeça">

        <h1 class="brand__name">
          <img class="brand__logo" src="assets/images/variacoes/logo-nome.svg" alt="Cookies by Borges" width="174" height="80">
          <svg class="brand__sparks" viewBox="0 0 30 30" aria-hidden="true" focusable="false"><use href="#i-sparks"/></svg>
        </h1>
      </header>

      <p class="hint">Clique na opção desejada:</p>

      <nav aria-label="Links da Cookies by Borges">
        <ul class="links">

          <!-- Cardápio -->
          <li>
            <a class="link-card" href="https://exemplo.com/cardapio">
              <span class="link-card__icon link-card__icon--jar" aria-hidden="true">
                <img src="assets/images/pote-biscioto.svg" alt="" width="99" height="113">
                <svg class="link-card__sparks link-card__sparks--left" viewBox="0 0 30 30" focusable="false"><use href="#i-sparks"/></svg>
              </span>
              <span class="link-card__text">
                <span class="link-card__title">Cardápio</span>
                <span class="link-card__subtitle">Nossos sabores</span>
              </span>
              <svg class="link-card__arrow" viewBox="0 0 16 24" aria-hidden="true" focusable="false"><use href="#i-chevron"/></svg>
            </a>
          </li>

          <!-- WhatsApp (sem ilustração própria: desenho no mesmo estilo dos adesivos) -->
          <li class="links__item--sticker">
            <!-- Cookie decorativo na borda direita entre Cardápio e WhatsApp -->
            <img class="deco deco-sticker deco-sticker--between" src="assets/images/sem-fundo/biscoito-mordido.svg" alt="" width="85" height="85">
            <a class="link-card" href="https://wa.me/5500000000000?text=Ol%C3%A1!%20Gostaria%20de%20fazer%20uma%20encomenda%20de%20cookies.">
              <span class="link-card__icon" aria-hidden="true">
                <svg viewBox="0 0 100 100" focusable="false">
                  <g filter="url(#rough)">
                    <path class="sticker-halo" d="M25.8 76.2A37 37 0 1 1 36.4 83.5L13 93Z"/>
                    <path class="ink ink--bold paper-card" d="M25.8 76.2A37 37 0 1 1 36.4 83.5L13 93Z"/>
                    <path class="ink" transform="translate(33 31) scale(1.6)" stroke-width="2.4" d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2Z"/>
                  </g>
                </svg>
                <svg class="link-card__sparks link-card__sparks--right" viewBox="0 0 30 30" focusable="false"></svg>
              </span>
              <span class="link-card__text">
                <span class="link-card__title">WhatsApp</span>
                <span class="link-card__subtitle">Dúvidas e encomendas</span>
              </span>
              <svg class="link-card__arrow" viewBox="0 0 16 24" aria-hidden="true" focusable="false"><use href="#i-chevron"/></svg>
            </a>
          </li>

          <!-- Retirada -->
          <li>
            <a class="link-card" href="https://maps.google.com/?q=Cookies+by+Borges">
              <span class="link-card__icon link-card__icon--pop" aria-hidden="true">
                <img src="assets/images/sem-fundo/saco-cookie-comido.svg" alt="" width="85" height="85">
              </span>
              <svg class="link-card__sparks link-card__sparks--card-right" viewBox="0 0 30 30" aria-hidden="true" focusable="false"><use href="#i-sparks"/></svg>
              <span class="link-card__text">
                <span class="link-card__title">Retirada</span>
                <span class="link-card__subtitle">Onde posso retirar?</span>
              </span>
              <svg class="link-card__arrow" viewBox="0 0 16 24" aria-hidden="true" focusable="false"><use href="#i-chevron"/></svg>
            </a>
          </li>

          <!-- Presencial -->
          <li>
            <a class="link-card" href="https://exemplo.com/locais">
              <span class="link-card__icon link-card__icon--pop" aria-hidden="true">
                <img src="assets/images/sem-fundo/biscoito-mordido.svg" alt="" width="85" height="85">
                <svg class="link-card__sparks link-card__sparks--left" viewBox="0 0 30 30" focusable="false"></svg>
              </span>
              <span class="link-card__text">
                <span class="link-card__title">Presencial</span>
                <span class="link-card__subtitle">Locais que estamos</span>
              </span>
              <svg class="link-card__arrow" viewBox="0 0 16 24" aria-hidden="true" focusable="false"><use href="#i-chevron"/></svg>
            </a>
          </li>

        </ul>
      </nav>

      <!-- Destaque sazonal: Catálogo de Natal (desativado; para reativar, apague as linhas "INÍCIO/FIM do comentário")
      INÍCIO do comentário
      <a class="featured" href="https://exemplo.com/catalogo-natal">
        <span class="featured__text">
          <span>Catálogo de</span>
          <span>Natal</span>
        </span>
        <svg class="featured__tree" viewBox="0 0 60 84" aria-hidden="true" focusable="false">
          <g filter="url(#rough)">
            <path class="snow--fill" d="M30 3l2.6 5.6 6 .7-4.5 4 1.3 6-5.4-3-5.4 3 1.3-6-4.5-4 6-.7Z"/>
            <path class="snow" d="M30 21 17 39H24L11 57H19L7 73H53L41 57H49L36 39H43Z"/>
            <path class="snow" d="M26 73v8h8v-8"/>
            <circle class="snow--fill" cx="27" cy="45" r="2.2"/>
            <circle class="snow--fill" cx="35" cy="55" r="2.2"/>
            <circle class="snow--fill" cx="22" cy="64" r="2.2"/>
            <circle class="snow--fill" cx="40" cy="66" r="2.2"/>
          </g>
        </svg>
      </a>
      FIM do comentário -->

      <!-- Avaliação -->
      <a class="tape" href="https://exemplo.com/avaliar">
        <svg class="tape__sparks" viewBox="0 0 30 30" aria-hidden="true" focusable="false"><use href="#i-sparks"/></svg>
        <span class="tape__paper">
          Avalie sua experiência
          <svg class="tape__heart" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#i-heart"/></svg>
        </span>
      </a>

      <footer class="footer">
        <img class="footer__quote" src="assets/images/frase-impacto.svg" width="142" height="111"
             alt="Life's better with cookies, by Borges" lang="en" loading="lazy" decoding="async">
      </footer>
    </main>

    <!-- Decoração lateral -->
    <img class="deco deco-sticker deco-sticker--bottom" src="assets/images/sem-fundo/fue-cookie.svg" alt="" width="85" height="85" loading="lazy" decoding="async">
  </div>
  </div>

</body>
</html>
